name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # Pastikan nama branch kamu 'main'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        # Di sini kita menyuntikkan secret ke dalam variable Vite
        run: npm run build
        env:
          VITE_TWILIO_SID: ${{ secrets.TWILIO_SID }}
          VITE_TWILIO_AUTH: ${{ secrets.TWILIO_AUTH }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Folder output Vite biasanya 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4